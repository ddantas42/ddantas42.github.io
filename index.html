<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kill Team Point Counter</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="start-page">
		<h1>Start of the Game</h1>
		<div class="operative-selection">
			<h2>Select Number of Operatives</h2>
				<div class="operative-box">
					<label for="player-operatives">Player's Operatives:</label>
					<select id="player-operatives" onchange="updateOperatives('player')"> <option value="5">5</option> <option value="6" selected>6</option> <option value="7">7</option> <option value="8">8</option> <option value="9">9</option> <option value="10">10</option> <option value="11">11</option> <option value="12">12</option> <option value="13">13</option> <option value="14">14</option>
					</select>
				</div>
				<div class="operative-box">
					<label for="opponent-operatives">Opponent's Operatives:</label>
					<select id="opponent-operatives" onchange="updateOperatives('opponent')"> <option value="5">5</option> <option value="6" selected>6</option> <option value="7">7</option> <option value="8">8</option> <option value="9">9</option> <option value="10">10</option> <option value="11">11</option> <option value="12">12</option> <option value="13">13</option> <option value="14">14</option>
					</select>
				</div>
			</div>
			<button onclick="startGame()">Start Game</button>
		</div>
	</div>

	<div id="middle-page" style="display: none;">
		<h1>Middle of the Game</h1>
	   
		<button onclick="endGame()">End Game</button>
	</div>

	<div id="end-page" style="display: none;">
		<h1>End of the Game</h1>


		<button onclick="resetGame()">Reset Game</button>
	</div>

	<script src="script.js"></script>
</body>
</html>
